<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-CAM WebSocket Viewer</title>
    <style>
        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .video-box {
            position: relative;
            width: 320px;
            margin: 10px;
        }
        .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        canvas {
            border: 1px solid #ccc;
        }
        .status {
            margin-top: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            padding: 3px;
            border-radius: 4px;
        }
        .connected {
            color: white;
            background-color: rgba(0, 128, 0, 0.7);
        }
        .disconnected {
            color: white;
            background-color: rgba(255, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div>
        <input type="text" id="wsUrl" placeholder="ws://192.168.1.48/ws" value="ws://192.168.1.48/ws">
        <button onclick="connectWebSocket()">Connect</button>
    </div>
    <div id="videoContainer" class="video-container"></div>
    <script>
        class VideoStream {
            constructor(url) {
                this.url = url;
                this.ws = null;
                this.canvas = null;
                this.container = null;
                this.status = null;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 4;
                this.reconnectTimeouts = [0, 3000, 10000, 30000, 60000]; // in milliseconds
                this.heartbeatInterval = null;
                this.lastMessageTime = null;
                this.createVideoBox();
                this.connect();
            }

            createVideoBox() {
                // Create container for this video stream
                this.container = document.createElement('div');
                this.container.className = 'video-box';

                // Create canvas for video display
                this.canvas = document.createElement('canvas');
                this.canvas.width = 640;
                this.canvas.height = 480;

                // Create close button
                const closeBtn = document.createElement('button');
                closeBtn.className = 'close-btn';
                closeBtn.innerHTML = '×';
                closeBtn.onclick = () => this.destroy();

                // Create status indicator
                this.status = document.createElement('div');
                this.status.className = 'status disconnected';
                this.status.textContent = 'Disconnected';

                // Add elements to container
                this.container.appendChild(this.canvas);
                this.container.appendChild(closeBtn);
                this.container.appendChild(this.status);

                // Add to main video container
                document.getElementById('videoContainer').appendChild(this.container);
            }

            connect() {
                try {
                    this.ws = new WebSocket(this.url);
                    this.ws.binaryType = 'arraybuffer';

                    this.ws.onopen = () => {
                        this.status.className = 'status connected';
                        this.status.textContent = 'Connected';
                        this.reconnectAttempts = 0;
                        this.lastMessageTime = Date.now();
                        this.startHeartbeat();
                    };

                    this.ws.onclose = () => {
                        this.handleDisconnection();
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket Error:', error);
                        this.status.className = 'status disconnected';
                        this.status.textContent = 'Error';
                        this.handleDisconnection();
                    };

                    this.ws.onmessage = (event) => {
                        this.lastMessageTime = Date.now();
                        this.handleFrame(event.data);
                    };
                } catch (error) {
                    console.error('Connection Error:', error);
                    this.status.className = 'status disconnected';
                    this.status.textContent = 'Connection Error';
                    this.handleDisconnection();
                }
            }

            startHeartbeat() {
                // Clear any existing heartbeat interval
                if (this.heartbeatInterval) {
                    clearInterval(this.heartbeatInterval);
                }

                // Check connection every 3 seconds
                this.heartbeatInterval = setInterval(() => {
                    const now = Date.now();
                    // If no messages received in last 5 seconds, consider connection dead
                    if (this.lastMessageTime && (now - this.lastMessageTime) > 5000) {
                        console.log('Connection timeout detected');
                        this.ws.close();
                        this.handleDisconnection();
                    }
                }, 3000);
            }

            handleDisconnection() {
                if (this.heartbeatInterval) {
                    clearInterval(this.heartbeatInterval);
                    this.heartbeatInterval = null;
                }
                
                this.status.className = 'status disconnected';
                this.status.textContent = 'Disconnected';
                
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
                
                this.tryReconnect();
            }

            tryReconnect() {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    const timeout = this.reconnectTimeouts[this.reconnectAttempts];
                    this.status.textContent = `Reconnecting in ${timeout/1000}s...`;
                    
                    setTimeout(() => {
                        this.reconnectAttempts++;
                        this.status.textContent = 'Attempting to reconnect...';
                        this.connect();
                    }, timeout);
                } else {
                    this.status.textContent = 'Connection failed. Please try manually.';
                }
            }

            handleFrame(data) {
                const ctx = this.canvas.getContext('2d');
                createImageBitmap(new Blob([data], { type: 'image/jpeg' }))
                    .then(imageBitmap => {
                        ctx.drawImage(imageBitmap, 0, 0, this.canvas.width, this.canvas.height);
                    })
                    .catch(error => console.error('Error drawing frame:', error));
            }

            destroy() {
                if (this.heartbeatInterval) {
                    clearInterval(this.heartbeatInterval);
                }
                if (this.ws) {
                    this.ws.close();
                }
                this.container.remove();
            }
        }

        function connectWebSocket() {
            const wsUrl = document.getElementById('wsUrl').value;
            if (wsUrl) {
                new VideoStream(wsUrl);
            } else {
                alert('Please enter a WebSocket URL');
            }
        }
    </script>
</body>
</html>
